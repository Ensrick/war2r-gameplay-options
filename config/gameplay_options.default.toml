# ---------------------------------------------------------------------------------------------------------------
# Your own base stats for a unit: one [unit.<name>] table per unit. -1 (or leaving a line out) keeps the game's own
# number; 0 is a real value where it makes sense (armor, damage, lumber, oil ...). These replace the game's base
# numbers first; the [health] / [costs] / [time] multipliers then apply on top of them.
# Names: every unit name listed under [polymorph], the ships (human_tanker orc_tanker human_transport orc_transport
# elven_destroyer troll_destroyer battleship juggernaught gnomish_submarine giant_turtle), flying_machine zeppelin
# ballista catapult.
#
#   hit_points 1-65535   armor 0-255   basic_damage 0-255   piercing_damage 0-255   range 0-20 tiles   sight 0-9
#   gold / lumber / oil 0-2550 in steps of 10   build_time 0-255
#
# Template:
# [unit.footman]
# hit_points = -1
# armor = -1
# basic_damage = -1
# piercing_damage = -1
# range = -1
# sight = -1
# gold = -1
# lumber = -1
# oil = -1
# build_time = -1
#
# Structures work the same way in [building.<name>] tables (hit_points tops out at 32767 there; the damage and range
# keys matter for the towers). Names: farm pig_farm human_barracks orc_barracks church altar_of_storms
# human_scout_tower orc_scout_tower stables ogre_mound gnomish_inventor goblin_alchemist gryphon_aviary dragon_roost
# human_shipyard orc_shipyard town_hall great_hall elven_lumber_mill troll_lumber_mill human_foundry orc_foundry
# mage_tower temple_of_the_damned human_blacksmith orc_blacksmith human_refinery orc_refinery human_oil_platform
# orc_oil_platform keep stronghold castle fortress human_guard_tower orc_guard_tower human_cannon_tower
# orc_cannon_tower human_wall orc_wall gold_mine dark_portal runestone
#
# Example (the game's guard tower: 130 hit points, armor 20, damage 4 basic + 12 piercing, range 6, sight 9,
# 500 gold / 150 lumber, build time 140):
# [building.human_guard_tower]
# hit_points = 200
# piercing_damage = 14
# range = 7
# ---------------------------------------------------------------------------------------------------------------

# Scouts of the sky: dragons and gryphon riders see 8 tiles instead of the game's 6.
[unit.dragon]
sight = 8

[unit.gryphon_rider]
sight = 8

# Worked example: both destroyers, every stat nudged a little so each one is easy to check in game.
# The game's own destroyer: 100 hit points, armor 10, damage 35 basic + 0 piercing, range 4, sight 8,
# 700 gold / 350 lumber / 700 oil, build time 90. Delete these two tables to get the normal destroyer back.
[unit.elven_destroyer]
hit_points = 105
armor = 11
basic_damage = 37
piercing_damage = 2
range = 5
sight = 9
gold = 600
lumber = 300
oil = 500
build_time = 80

