# Warcraft II Remastered - Gameplay Options
# Edits are picked up while the game runs (within a few seconds). A syntax error keeps the previous settings
# and is reported in gameplay_options.log. Single-player only: everything here switches itself off in multiplayer.

[general]
enabled = true
# Ctrl + this key toggles autocast in game. "F1".."F12", or a Windows virtual-key number.
toggle_key = "F9"
# Game steps between autocast passes. Lower = snappier; the computer AI itself uses 50.
interval_ticks = 10
# true = write every cast to gameplay_options.log
log_casts = false

[autocast]
# How far (tiles) a caster looks for targets. It walks into range if needed.
search_radius = 8
# Bloodlust / Haste / Unholy Armor only go on units that are fighting: attacking with an enemy this close.
combat_radius = 6
# true = Heal / Bloodlust / Haste only on your own units, false = allies too.
own_units_only = true
# true = casters may interrupt their own attack to cast. Move orders are never interrupted.
cast_while_attacking = true

[spells]
heal = true
exorcism = true
slow = true
polymorph = true
bloodlust = true
death_coil = true
haste = true
unholy_armor = false
# Raise Dead is only cast while an enemy is within search_radius, so skeletons are not wasted.
raise_dead = true

[heal]
# Heal only units missing at least this many hit points.
min_missing_hp = 10
# Extra gate: also require the unit to be at or below this percent of max HP. 100 = off.
below_percent = 100

[polymorph]
# Valid Polymorph targets in priority order: the first type in this list that is in range gets sheeped,
# nearest one first. Anything not listed is never polymorphed. Only living (organic) units can be affected.
# Names: footman grunt peasant peon knight ogre archer axethrower mage death_knight paladin ogre_mage dwarves
#   goblin_sappers ranger berserker gryphon_rider dragon daemon skeleton critter
#   heroes: alleria teron_gorefiend kurdran dentarg khadgar grom_hellscream deathwing turalyon danath
#   korgath_bladefist chogall lothar guldan uther_lightbringer zuljin
targets = [
    "deathwing", "kurdran", "dragon", "gryphon_rider", "daemon",
    "death_knight", "mage", "ogre_mage", "paladin",
    "teron_gorefiend", "guldan", "khadgar", "dentarg", "chogall", "turalyon", "uther_lightbringer",
    "grom_hellscream", "korgath_bladefist", "danath", "alleria", "knight", "ogre", "lothar",
]

[haste]
# true = Haste only on your flying units, when they are sent to attack or are fighting. false = any fighting unit.
flyers_only = true

[eye_of_kilrogg]
# Ogre-magi cast Eye of Kilrogg on their own. Only an idle ogre-mage does it (the cast makes it stop).
cast = true
# Mana the ogre-mage must have before it casts. 255 = only when full, which is the computer's own rule,
# so Bloodlust always gets first call on the mana.
cast_at_mana = 255
# How many of your eyes may be out at the same time.
max_active = 1
# Your eyes fly to unexplored ground by themselves (then to fogged ground once everything is explored).
# Give an eye an order of your own and the mod leaves that eye to you.
auto_scout = true

[gold_mines]
# true = gold mines never run dry (every mine on the map, the computer's too). Off by default: starving a mine
# is a legitimate way to win some campaign missions, but a computer that runs out of gold can stall a long game.
unlimited = false

[workers]
# Your idle peasants / peons go back to work by themselves. "Idle" means stopped with nothing queued.
# Stand Ground is respected: a worker you told to stand ground is never taken over.
# Idle this long -> walk to the nearest gold mine or tree within harvest_radius tiles (a loaded worker returns
# its cargo first).
auto_harvest = true
harvest_idle_seconds = 10
harvest_radius = 5
# Idle this long -> repair the nearest damaged building of yours within repair_radius tiles. Needs at least
# 1 gold and 1 lumber in the bank; buildings still under construction are left alone.
auto_repair = true
repair_idle_seconds = 1
repair_radius = 10

[heroes]
# Which unit types count as heroes (used by hero regeneration and the hero health multiplier).
# All 15 heroes of both campaigns are listed. Short names work too: "uther", "grom", "teron", "korgath".
units = [
    # Alliance
    "alleria", "danath", "khadgar", "kurdran", "lothar", "turalyon", "uther_lightbringer",
    # Horde
    "chogall", "dentarg", "grom_hellscream", "guldan", "korgath_bladefist", "teron_gorefiend", "zuljin",
    "deathwing",
]
# Hit points every hero regenerates per second of play. 0 = off.
regen_hp_per_second = 1
# "all" = every hero on the map (enemy heroes too), "mine" = only your own.
regen_for = "all"

# ---------------------------------------------------------------------------------------------------------------
# The sections below change the game's unit, structure and research data. They are applied once, when a NEW map
# starts (new mission, custom game, restart). Editing them mid-game does nothing until the next map. A savegame keeps
# the values it was made with: saves from before the mod stay unchanged, saves made with the mod keep their numbers.
# The computer plays by the same numbers.
#
# [health], [costs] and [time] are multipliers and share one layout. 1.0 = the game's own number, 0.5 = half,
# 2.0 = double. The values multiply into each other, top down:
#     [x] all   x   [x.human] or [x.orc] all   x   units / research (umbrella)   x   the group
# so "all = 2.0" at the top doubles everything, and "[health.orc] melee = 1.5" adds 50% for grunts, ogres and
# ogre-magi on top of that.
#
# Groups     workers      peasant, peon
#            melee        footman, knight, paladin / grunt, ogre, ogre-mage
#            ranged       archer, ranger / axethrower, berserker
#            siege        ballista / catapult
#            casters      mage / death knight
#            air          gryphon rider, flying machine / dragon, zeppelin
#            naval        every ship
#            demolition   dwarves / goblin sappers
#            heroes       the unit types listed under [heroes] units (health only, heroes are never trained)
#            buildings           structures your workers place
#            building_upgrades   keep / stronghold, castle / fortress, guard tower, cannon tower
#            melee_upgrades      swords, shields / battle axes, shields
#            ranged_upgrades     arrows, ranger upgrade, longbow, scouting, marksmanship / throwing axes, berserker
#                                upgrade, lighter axes, scouting, regeneration
#            siege_upgrades      ballista / catapult upgrades
#            naval_upgrades      ship cannons and ship armor
#            paladin_upgrades    paladin upgrade, holy vision, healing, exorcism
#            ogre_mage_upgrades  ogre-mage upgrade, eye of kilrogg, bloodlust, runes
#            mage_spells / death_knight_spells   their spell research
#
# Engine limits: hit points 65535 (from 10000 up the status panel stops printing the numbers), unit and structure
# prices 2550 in steps of 10, research prices 65535, build and research times 255 (many are already 200-255, so
# times can be shortened freely but barely lengthened). Free things stay free.
# ---------------------------------------------------------------------------------------------------------------

[health]
# "all" is the master multiplier for UNIT health. It never touches structures, and neither do the race "all" values
# or the unit groups. Structures follow only their own two keys below: buildings and building_upgrades
# (keep / stronghold, castle / fortress, guard and cannon towers). Structure health tops out at 32767.
all = 1.0

[health.human]
all = 1.0
workers = 1.0
melee = 1.0
ranged = 1.0
siege = 1.0
casters = 1.0
air = 1.0
